services:
  - type: web
    name: nichijobase
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: ./scripts/render-start.sh
    envVars:
      - key: APP_NAME
        value: 日常BASE
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: ADMIN_API_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RENDER_SEED_DATABASE
        value: "false"
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
